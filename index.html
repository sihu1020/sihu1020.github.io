<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유령도시 작전 로비</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Pretendard:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #070a0f;
        --bg-soft: #101722;
        --panel: rgba(19, 28, 43, 0.9);
        --panel-border: rgba(108, 128, 168, 0.45);
        --accent: #ffbf55;
        --accent-strong: #ff9f1c;
        --grid-line: rgba(255, 255, 255, 0.07);
        --card-face: rgba(14, 18, 27, 0.95);
        --hud-text: #f6f8ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Pretendard", system-ui, sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(46, 115, 255, 0.25), transparent 55%),
          radial-gradient(circle at 80% 0%, rgba(255, 90, 90, 0.2), transparent 45%),
          radial-gradient(circle at 50% 80%, rgba(18, 219, 149, 0.18), transparent 50%),
          var(--bg);
        color: #e3e8ff;
      }

      #app {
        width: min(1200px, 100%);
        margin: 0 auto;
        padding: 2rem clamp(1rem, 4vw, 2.5rem) 4rem;
      }

      .logo-title {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .logo-title h1 {
        font-family: "Orbitron", "Pretendard", sans-serif;
        letter-spacing: 0.12em;
        font-size: clamp(1.4rem, 3.5vw, 2.6rem);
        color: #f8f9ff;
        margin: 0.5rem 0 0;
        text-transform: uppercase;
      }

      .logo-title p {
        margin: 0;
        color: rgba(255, 255, 255, 0.7);
      }

      .lobby-grid {
        display: grid;
        gap: 1.25rem;
      }

      @media (min-width: 720px) {
        .lobby-grid {
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }
      }

      .room-card {
        background: var(--panel);
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        padding: 1.5rem;
        box-shadow: 0 25px 55px rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .room-card h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .room-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.8);
      }

      .btn {
        font: inherit;
        border: none;
        border-radius: 10px;
        padding: 0.7rem 1.2rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(120deg, var(--accent), var(--accent-strong));
        color: #1f1204;
        font-weight: 600;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(255, 165, 52, 0.35);
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 0.9);
      }

      .game-layout {
        display: grid;
        grid-template-columns: minmax(170px, 240px) 1fr minmax(170px, 240px);
        grid-template-rows: auto 1fr auto;
        gap: 1.25rem;
        position: relative;
      }

      .hud-panel {
        background: var(--panel);
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        padding: 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      }

      .hud-panel h3 {
        margin: 0;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.8);
      }

      .hud-panel strong {
        font-size: 1.1rem;
        color: var(--hud-text);
      }

      .player-color {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.9rem;
      }

      .swatch {
        width: 0.85rem;
        height: 0.85rem;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.4);
      }

      .progress {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .hud-panel .meta {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.75);
      }

      .hearts {
        display: flex;
        gap: 0.3rem;
      }

      .heart {
        width: 16px;
        height: 14px;
        background: rgba(255, 255, 255, 0.18);
        clip-path: path("M8 14s-6-3.9-6-8.1C2 3 3.8 1 6 1c1.4 0 2.3 0.9 2 1.5C8.7 1.9 9.6 1 11 1c2.2 0 4 2 4 4.9C15 10.1 8 14 8 14z");
      }

      .heart.full {
        background: #ff5c8d;
      }

      .board-wrapper {
        grid-row: 2 / span 1;
        grid-column: 2 / span 1;
        background: var(--card-face);
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: clamp(1rem, 3vw, 1.75rem);
        box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.75), 0 30px 60px rgba(0, 0, 0, 0.55);
        position: relative;
        overflow: hidden;
      }

      .axes-labels {
        display: flex;
        justify-content: space-between;
        gap: 0.35rem;
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        opacity: 0.65;
        font-family: "Orbitron", sans-serif;
      }

      .axes-labels.vertical {
        position: absolute;
        top: clamp(1.3rem, 3.2vw, 1.7rem);
        bottom: clamp(1.3rem, 3.2vw, 1.7rem);
        left: 0.5rem;
        flex-direction: column;
        width: auto;
        justify-content: space-between;
      }

      .axes-labels.vertical.right {
        left: auto;
        right: 0.5rem;
        text-align: right;
        align-items: flex-end;
      }

      .board-grid {
        width: 100%;
        aspect-ratio: 1;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        grid-template-rows: repeat(20, 1fr);
        gap: 1px;
        background: var(--grid-line);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .cell {
        background: rgba(15, 20, 28, 0.9);
        position: relative;
      }

      .cell:nth-child(odd) {
        background: rgba(17, 25, 35, 0.92);
      }

      .card-piles {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
      }

      .pile-group {
        display: flex;
        gap: 1rem;
      }

      .pile {
        width: 120px;
        height: 170px;
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.25));
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        padding: 0.9rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.4rem;
      }

      .pile span {
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        opacity: 0.7;
      }

      .pile strong {
        font-size: 1.3rem;
        color: var(--accent);
      }

      .hud-north {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
      }

      .hud-south {
        grid-column: 2 / 3;
        grid-row: 3 / 4;
      }

      .hud-west {
        grid-column: 1 / 2;
        grid-row: 2 / 3;
      }

      .hud-east {
        grid-column: 3 / 4;
        grid-row: 2 / 3;
      }

      @media (max-width: 960px) {
        .game-layout {
          grid-template-columns: 1fr;
          grid-template-rows: repeat(4, auto) auto;
        }

        .hud-north,
        .hud-south,
        .hud-west,
        .hud-east,
        .board-wrapper {
          grid-column: 1 / -1;
        }
      }

      .room-info-chip {
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.6);
      }

      footer {
        text-align: center;
        margin-top: 2rem;
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <template id="lobby-template">
      <div class="logo-title">
        <p>은밀 작전 시스템 접속</p>
        <h1>유령도시 방어 로비</h1>
      </div>
      <section class="lobby-grid" data-rooms></section>
    </template>

    <template id="game-template">
      <div class="logo-title">
        <p>선택한 작전 방 <span data-room-name></span></p>
        <h1>전장 제어 콘솔</h1>
        <button class="btn btn-ghost" data-back>로비로 돌아가기</button>
      </div>
      <section class="game-layout" data-game></section>
    </template>

    <script>
      const state = {
        rooms: [
          {
            id: 1,
            title: "001 · 진홍의 전략실",
            desc: "직감형 지휘관을 위한 전투 기록실.",
            players: "3/5",
          },
          {
            id: 2,
            title: "002 · 황혼 교차점",
            desc: "일몰과 함께 열리는 비밀 전장.",
            players: "4/6",
          },
          {
            id: 3,
            title: "003 · 블루 아웃포스트",
            desc: "파란 보초들이 잠들지 않는 초소.",
            players: "2/4",
          },
          {
            id: 4,
            title: "004 · 에메랄드 정비고",
            desc: "회복과 연구가 동시에 이루어지는 곳.",
            players: "5/6",
          },
          {
            id: 5,
            title: "005 · 흑야 봉쇄선",
            desc: "도시 최전선의 봉쇄 구역.",
            players: "1/4",
          },
        ],
        players: [
          {
            slot: "south",
            colorLabel: "빨",
            colorCode: "#f87171",
            character: "서광의 검사",
            ability: "초고속 반격",
            progress: 72,
            lives: 3,
          },
          {
            slot: "east",
            colorLabel: "노",
            colorCode: "#facc15",
            character: "황혼 수호자",
            ability: "성역 방벽",
            progress: 40,
            lives: 2,
          },
          {
            slot: "north",
            colorLabel: "파",
            colorCode: "#38bdf8",
            character: "청해의 추적자",
            ability: "심연 추격",
            progress: 55,
            lives: 4,
          },
          {
            slot: "west",
            colorLabel: "초",
            colorCode: "#34d399",
            character: "비취 도약가",
            ability: "연속 대쉬",
            progress: 33,
            lives: 3,
          },
        ],
        piles: [
          { label: "전술 카드", count: 32 },
          { label: "사건 카드", count: 18 },
        ],
        selectedRoom: null,
      };

      const app = document.getElementById("app");
      const lobbyTemplate = document.getElementById("lobby-template");
      const gameTemplate = document.getElementById("game-template");

      function renderLobby() {
        const view = lobbyTemplate.content.cloneNode(true);
        const list = view.querySelector("[data-rooms]");
        list.innerHTML = state.rooms
          .map(
            (room) => `
              <article class="room-card">
                <div>
                  <h2>${room.title}</h2>
                  <p>${room.desc}</p>
                </div>
                <div class="room-meta">
                  <span>참가자: ${room.players}</span>
                  <span>#${room.id.toString().padStart(3, "0")}</span>
                </div>
                <button class="btn btn-primary" data-join="${room.id}">입장</button>
              </article>
            `
          )
          .join("");

        list.querySelectorAll("[data-join]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const roomId = Number(btn.dataset.join);
            state.selectedRoom = state.rooms.find((room) => room.id === roomId);
            render();
          });
        });
        app.replaceChildren(view);
      }

      function renderGame() {
        const view = gameTemplate.content.cloneNode(true);
        view.querySelector("[data-room-name]").textContent = state.selectedRoom?.title ?? "";

        view.querySelector("[data-back]").addEventListener("click", () => {
          state.selectedRoom = null;
          render();
        });

        const layout = view.querySelector("[data-game]");
        layout.innerHTML = `
          ${state.players
            .map((player) => createHud(player))
            .join("")}
          ${createBoard()}
        `;

        app.replaceChildren(view);
      }

      function createHud(player) {
        const positionClass = `hud-${player.slot}`;
        const heartIcons = Array.from({ length: 4 }, (_, idx) => {
          const filled = idx < player.lives ? "full" : "";
          return `<span class="heart ${filled}"></span>`;
        }).join("");

        return `
          <article class="hud-panel ${positionClass}">
            <div class="room-info-chip">ROOM ${state.selectedRoom?.id ?? "-"}</div>
            <h3>${player.slot.toUpperCase()} · ${player.colorLabel}</h3>
            <div class="player-color">
              <span class="swatch" style="background:${player.colorCode}"></span>
              <strong>${player.character}</strong>
            </div>
            <div class="meta">능력: ${player.ability}</div>
            <div class="meta">진행률 ${player.progress}%</div>
            <div class="progress">
              <span style="background:${player.colorCode}; width:${player.progress}%"></span>
            </div>
            <div class="meta">생존 상태</div>
            <div class="hearts">${heartIcons}</div>
          </article>
        `;
      }

      function createBoard() {
        const gridCells = Array.from({ length: 400 }, () => '<div class="cell"></div>').join("");
        const axisX = Array.from({ length: 20 }, (_, idx) => idx + 1)
          .map((num) => `<span>${String(num).padStart(2, "0")}</span>`)
          .join("");
        const axisY = Array.from({ length: 20 }, (_, idx) => String.fromCharCode(65 + idx))
          .map((letter) => `<span>${letter}</span>`)
          .join("");

        return `
          <section class="board-wrapper">
            <div class="axes-labels">${axisX}</div>
            <div class="axes-labels vertical">${axisY}</div>
            <div class="axes-labels vertical right">${axisY}</div>
            <div class="board-grid">${gridCells}</div>
            <div class="axes-labels" style="margin-top: 0.3rem">${axisX}</div>
            <div class="card-piles">
              <div class="pile-group">
                ${state.piles
                  .map(
                    (pile) => `
                      <div class="pile">
                        <span>${pile.label}</span>
                        <strong>${pile.count}</strong>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </section>
        `;
      }

      function render() {
        if (!state.selectedRoom) {
          renderLobby();
          return;
        }
        renderGame();
      }

      render();
    </script>
    <footer>도시 규칙서 미학을 본뜬 인터페이스 © 2024</footer>
  </body>
</html>
