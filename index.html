<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하루 일기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #fff7ed;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-strong: #ffffff;
        --ink: #2f241d;
        --muted: #746457;
        --accent: #f97316;
        --accent-strong: #c2410c;
        --accent-soft: rgba(251, 146, 60, 0.2);
        --green: #16a34a;
        --rose: #fb7185;
        --border: rgba(194, 65, 12, 0.16);
        --shadow: 0 22px 55px rgba(154, 52, 18, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Pretendard", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 10%, rgba(253, 186, 116, 0.45), transparent 30%),
          radial-gradient(circle at 85% 20%, rgba(251, 113, 133, 0.28), transparent 32%),
          linear-gradient(135deg, #fff7ed 0%, #fffbeb 52%, #fff1f2 100%);
        color: var(--ink);
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .hero {
        position: relative;
        overflow: hidden;
        display: grid;
        gap: 28px;
        padding: clamp(28px, 5vw, 56px);
        border: 1px solid var(--border);
        border-radius: 36px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.82), rgba(255, 247, 237, 0.68)),
          url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23fed7aa' stroke-width='2' opacity='0.55'%3E%3Cpath d='M28 48c20-28 52-28 72 0 20 28 52 28 72 0'/%3E%3Cpath d='M-12 108c20-28 52-28 72 0 20 28 52 28 72 0'/%3E%3C/g%3E%3C/svg%3E");
        box-shadow: var(--shadow);
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -80px;
        top: -80px;
        width: 240px;
        height: 240px;
        border-radius: 999px;
        background: rgba(249, 115, 22, 0.16);
      }

      .hero-content {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 18px;
        max-width: 740px;
      }

      .eyebrow {
        width: fit-content;
        margin: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-strong);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5.5rem);
        line-height: 0.95;
        letter-spacing: -0.08em;
      }

      .hero p:not(.eyebrow) {
        color: var(--muted);
        font-size: clamp(1.02rem, 2vw, 1.25rem);
        line-height: 1.75;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 46px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: white;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 12px 24px rgba(249, 115, 22, 0.24);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
        background: var(--accent-strong);
        box-shadow: 0 16px 30px rgba(249, 115, 22, 0.28);
      }

      .button.secondary {
        background: rgba(255, 255, 255, 0.82);
        color: var(--accent-strong);
        border: 1px solid var(--border);
        box-shadow: none;
      }

      .dashboard {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        position: relative;
        z-index: 1;
      }

      .stat {
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(8px);
      }

      .stat strong {
        display: block;
        margin-bottom: 4px;
        font-size: 1.8rem;
        color: var(--accent-strong);
      }

      .stat span {
        color: var(--muted);
        font-weight: 600;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
        gap: 22px;
        margin-top: 24px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 18px 44px rgba(154, 52, 18, 0.09);
        backdrop-filter: blur(10px);
      }

      .card-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
        padding: 26px 26px 0;
      }

      .card h2 {
        font-size: 1.55rem;
        letter-spacing: -0.03em;
      }

      .card small {
        color: var(--muted);
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 16px;
        padding: 24px 26px 26px;
      }

      label {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-weight: 700;
      }

      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid rgba(154, 52, 18, 0.18);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
        padding: 13px 15px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea {
        min-height: 180px;
        resize: vertical;
        line-height: 1.7;
      }

      input:focus,
      textarea:focus,
      select:focus {
        border-color: rgba(249, 115, 22, 0.68);
        box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.14);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .mood-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      .mood-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .mood-option span {
        display: grid;
        place-items: center;
        min-height: 52px;
        border: 1px solid rgba(154, 52, 18, 0.16);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.7);
        font-size: 1.45rem;
        transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
      }

      .mood-option input:checked + span {
        transform: translateY(-2px) scale(1.04);
        border-color: rgba(249, 115, 22, 0.7);
        background: var(--accent-soft);
      }

      .prompt-box {
        padding: 16px;
        border-radius: 20px;
        background: #fff7ed;
        color: var(--accent-strong);
        line-height: 1.65;
        font-weight: 700;
      }

      .entries {
        display: grid;
        gap: 14px;
        padding: 22px 26px 26px;
      }

      .tools {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .tools select {
        min-width: 132px;
        padding: 10px 12px;
        border-radius: 999px;
      }

      .entry {
        display: grid;
        gap: 12px;
        padding: 18px;
        border: 1px solid rgba(154, 52, 18, 0.14);
        border-radius: 22px;
        background: var(--surface-strong);
      }

      .entry-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .entry h3 {
        font-size: 1.13rem;
      }

      .entry time,
      .entry .tag {
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 700;
      }

      .entry p {
        color: #4a3a30;
        line-height: 1.72;
        white-space: pre-wrap;
      }

      .entry-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .text-button {
        border: 0;
        border-radius: 999px;
        background: #ffedd5;
        color: var(--accent-strong);
        padding: 8px 12px;
        font-weight: 800;
      }

      .text-button.delete {
        background: #ffe4e6;
        color: #be123c;
      }

      .empty {
        padding: 28px;
        border: 1px dashed rgba(154, 52, 18, 0.22);
        border-radius: 22px;
        color: var(--muted);
        text-align: center;
        line-height: 1.7;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        opacity: 0;
        z-index: 10;
        padding: 13px 18px;
        border-radius: 999px;
        background: #2f241d;
        color: white;
        font-weight: 700;
        box-shadow: var(--shadow);
        transition: opacity 0.25s ease, transform 0.25s ease;
      }

      .toast.visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }

      footer {
        padding: 28px 0 0;
        color: var(--muted);
        text-align: center;
        font-size: 0.92rem;
      }

      @media (max-width: 860px) {
        .dashboard,
        .layout,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .card-header {
          flex-direction: column;
        }
      }

      @media (max-width: 560px) {
        main {
          width: min(100% - 20px, 1120px);
          padding-top: 10px;
        }

        .hero,
        .card {
          border-radius: 24px;
        }

        .mood-row {
          grid-template-columns: repeat(3, 1fr);
        }

        .hero-actions,
        .entry-top,
        .tools {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-content">
          <p class="eyebrow">오늘을 붙잡는 작은 습관</p>
          <h1 id="page-title">하루 일기</h1>
          <p>
            지나가기 쉬운 감정, 고마웠던 순간, 내일의 다짐을 한 곳에 모아보세요.
            작성한 일기는 브라우저에 안전하게 저장되어 나만의 하루 기록장이 됩니다.
          </p>
          <div class="hero-actions">
            <a class="button" href="#diary-form">오늘 기록하기</a>
            <a class="button secondary" href="#entries-section">지난 일기 보기</a>
          </div>
        </div>
        <div class="dashboard" aria-label="일기 통계">
          <div class="stat">
            <strong id="total-count">0</strong>
            <span>저장된 일기</span>
          </div>
          <div class="stat">
            <strong id="streak-count">0</strong>
            <span>연속 기록일</span>
          </div>
          <div class="stat">
            <strong id="favorite-mood">–</strong>
            <span>자주 느낀 기분</span>
          </div>
        </div>
      </section>

      <div class="layout">
        <section class="card" aria-labelledby="write-title">
          <div class="card-header">
            <div>
              <h2 id="write-title">오늘의 일기 쓰기</h2>
              <small>제목, 기분, 감사한 일을 적고 저장해보세요.</small>
            </div>
          </div>
          <form id="diary-form">
            <div class="form-grid">
              <label>
                날짜
                <input id="entry-date" type="date" required />
              </label>
              <label>
                제목
                <input id="entry-title" type="text" maxlength="40" placeholder="오늘을 한 줄로 표현하면?" required />
              </label>
            </div>

            <label>
              오늘의 기분
              <div class="mood-row" role="radiogroup" aria-label="오늘의 기분 선택">
                <label class="mood-option"><input type="radio" name="mood" value="😊" checked /><span>😊</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="🥰" /><span>🥰</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="😌" /><span>😌</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="😮‍💨" /><span>😮‍💨</span></label>
                <label class="mood-option"><input type="radio" name="mood" value="🌧️" /><span>🌧️</span></label>
              </div>
            </label>

            <div class="prompt-box" id="daily-prompt"></div>

            <label>
              일기 내용
              <textarea id="entry-body" placeholder="오늘 있었던 일과 마음에 남은 장면을 자유롭게 적어보세요." required></textarea>
            </label>
            <label>
              감사한 일 3가지 또는 내일의 다짐
              <input id="entry-gratitude" type="text" placeholder="예: 친구와 웃은 시간, 맛있는 저녁, 10분 산책" />
            </label>
            <button class="button" type="submit" id="save-button">일기 저장하기</button>
          </form>
        </section>

        <section class="card" id="entries-section" aria-labelledby="entries-title">
          <div class="card-header">
            <div>
              <h2 id="entries-title">지난 일기</h2>
              <small>최근에 쓴 일기부터 보여드려요.</small>
            </div>
            <div class="tools">
              <select id="mood-filter" aria-label="기분으로 일기 필터링">
                <option value="all">전체 기분</option>
                <option value="😊">😊</option>
                <option value="🥰">🥰</option>
                <option value="😌">😌</option>
                <option value="😮‍💨">😮‍💨</option>
                <option value="🌧️">🌧️</option>
              </select>
              <button class="text-button" type="button" id="export-button">내보내기</button>
            </div>
          </div>
          <div class="entries" id="entries-list"></div>
        </section>
      </div>

      <footer>© 2026 하루 일기 · 오늘의 나를 다정하게 기록하는 공간</footer>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "daily-diary-entries";
      const prompts = [
        "오늘 나를 가장 웃게 만든 순간은 무엇이었나요?",
        "오늘 배운 것 하나와 내일 시도하고 싶은 것 하나를 적어보세요.",
        "지금의 나에게 건네고 싶은 다정한 말은 무엇인가요?",
        "오늘 고마웠던 사람이나 장면을 자세히 떠올려보세요.",
        "하루 중 가장 평온했던 10분은 언제였나요?"
      ];

      const dom = {
        form: document.getElementById("diary-form"),
        date: document.getElementById("entry-date"),
        title: document.getElementById("entry-title"),
        body: document.getElementById("entry-body"),
        gratitude: document.getElementById("entry-gratitude"),
        prompt: document.getElementById("daily-prompt"),
        entriesList: document.getElementById("entries-list"),
        moodFilter: document.getElementById("mood-filter"),
        exportButton: document.getElementById("export-button"),
        totalCount: document.getElementById("total-count"),
        streakCount: document.getElementById("streak-count"),
        favoriteMood: document.getElementById("favorite-mood"),
        toast: document.getElementById("toast")
      };

      let entries = loadEntries();
      let editingId = null;

      function todayString() {
        const today = new Date();
        const offset = today.getTimezoneOffset() * 60000;
        return new Date(today.getTime() - offset).toISOString().slice(0, 10);
      }

      function loadEntries() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? [];
        } catch (error) {
          console.error("일기 데이터를 불러오지 못했습니다.", error);
          return [];
        }
      }

      function saveEntries() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }

      function getSelectedMood() {
        return new FormData(dom.form).get("mood") ?? "😊";
      }

      function setSelectedMood(mood) {
        const input = dom.form.querySelector(`input[name="mood"][value="${mood}"]`);
        if (input) input.checked = true;
      }

      function formatDate(date) {
        return new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "short"
        }).format(new Date(`${date}T00:00:00`));
      }

      function showToast(message) {
        dom.toast.textContent = message;
        dom.toast.classList.add("visible");
        window.setTimeout(() => dom.toast.classList.remove("visible"), 2200);
      }

      function renderPrompt() {
        const dayIndex = Math.floor(new Date(`${dom.date.value}T00:00:00`).getTime() / 86400000);
        dom.prompt.textContent = `오늘의 질문 · ${prompts[Math.abs(dayIndex) % prompts.length]}`;
      }

      function calculateStreak() {
        const uniqueDates = [...new Set(entries.map((entry) => entry.date))].sort().reverse();
        if (!uniqueDates.length) return 0;

        let streak = 0;
        let cursor = new Date(`${todayString()}T00:00:00`);
        const dateSet = new Set(uniqueDates);

        while (dateSet.has(cursor.toISOString().slice(0, 10))) {
          streak += 1;
          cursor.setDate(cursor.getDate() - 1);
        }
        return streak;
      }

      function calculateFavoriteMood() {
        if (!entries.length) return "–";
        const counts = entries.reduce((acc, entry) => {
          acc[entry.mood] = (acc[entry.mood] ?? 0) + 1;
          return acc;
        }, {});
        return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
      }

      function renderStats() {
        dom.totalCount.textContent = entries.length;
        dom.streakCount.textContent = calculateStreak();
        dom.favoriteMood.textContent = calculateFavoriteMood();
      }

      function renderEntries() {
        const filter = dom.moodFilter.value;
        const visibleEntries = entries
          .filter((entry) => filter === "all" || entry.mood === filter)
          .sort((a, b) => new Date(b.date) - new Date(a.date) || b.createdAt.localeCompare(a.createdAt));

        dom.entriesList.innerHTML = "";
        if (!visibleEntries.length) {
          dom.entriesList.innerHTML = `<div class="empty">아직 보여줄 일기가 없어요.<br />오늘의 첫 문장을 남겨보세요.</div>`;
          return;
        }

        visibleEntries.forEach((entry) => {
          const article = document.createElement("article");
          article.className = "entry";
          article.innerHTML = `
            <div class="entry-top">
              <div>
                <h3>${entry.mood} ${escapeHtml(entry.title)}</h3>
                <time datetime="${entry.date}">${formatDate(entry.date)}</time>
              </div>
              <span class="tag">${entry.gratitude ? "감사 기록 있음" : "자유 기록"}</span>
            </div>
            <p>${escapeHtml(entry.body)}</p>
            ${entry.gratitude ? `<p><strong>감사/다짐</strong> · ${escapeHtml(entry.gratitude)}</p>` : ""}
            <div class="entry-actions">
              <button class="text-button" type="button" data-action="edit" data-id="${entry.id}">수정</button>
              <button class="text-button delete" type="button" data-action="delete" data-id="${entry.id}">삭제</button>
            </div>
          `;
          dom.entriesList.appendChild(article);
        });
      }

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function resetForm() {
        editingId = null;
        dom.form.reset();
        dom.date.value = todayString();
        document.getElementById("save-button").textContent = "일기 저장하기";
        renderPrompt();
      }

      function upsertEntry(event) {
        event.preventDefault();
        const entry = {
          id: editingId ?? crypto.randomUUID(),
          date: dom.date.value,
          title: dom.title.value.trim(),
          mood: getSelectedMood(),
          body: dom.body.value.trim(),
          gratitude: dom.gratitude.value.trim(),
          createdAt: editingId ? entries.find((item) => item.id === editingId).createdAt : new Date().toISOString()
        };

        if (editingId) {
          entries = entries.map((item) => (item.id === editingId ? entry : item));
          showToast("일기를 수정했어요.");
        } else {
          entries = [entry, ...entries];
          showToast("오늘의 일기를 저장했어요.");
        }

        saveEntries();
        resetForm();
        render();
      }

      function handleEntryAction(event) {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const entry = entries.find((item) => item.id === button.dataset.id);
        if (!entry) return;

        if (button.dataset.action === "delete") {
          entries = entries.filter((item) => item.id !== entry.id);
          saveEntries();
          render();
          showToast("일기를 삭제했어요.");
          return;
        }

        editingId = entry.id;
        dom.date.value = entry.date;
        dom.title.value = entry.title;
        dom.body.value = entry.body;
        dom.gratitude.value = entry.gratitude;
        setSelectedMood(entry.mood);
        document.getElementById("save-button").textContent = "수정 내용 저장하기";
        renderPrompt();
        dom.form.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function exportEntries() {
        if (!entries.length) {
          showToast("내보낼 일기가 없어요.");
          return;
        }
        const lines = entries
          .sort((a, b) => new Date(b.date) - new Date(a.date))
          .map((entry) => [`# ${entry.mood} ${entry.title}`, formatDate(entry.date), entry.body, entry.gratitude ? `감사/다짐: ${entry.gratitude}` : ""].filter(Boolean).join("\n"));
        const blob = new Blob([lines.join("\n\n---\n\n")], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "하루-일기.txt";
        link.click();
        URL.revokeObjectURL(url);
        showToast("일기 파일을 만들었어요.");
      }

      function render() {
        renderStats();
        renderEntries();
      }

      dom.date.value = todayString();
      renderPrompt();
      render();
      dom.date.addEventListener("change", renderPrompt);
      dom.form.addEventListener("submit", upsertEntry);
      dom.entriesList.addEventListener("click", handleEntryAction);
      dom.moodFilter.addEventListener("change", renderEntries);
      dom.exportButton.addEventListener("click", exportEntries);
    </script>
  </body>
</html>
