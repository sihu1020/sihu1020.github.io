<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수학 서바이벌 전장</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Pretendard:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7fff9;
        --bg-soft: #e5ffe7;
        --panel: rgba(255, 255, 255, 0.9);
        --panel-border: rgba(110, 170, 130, 0.4);
        --accent: #74da72;
        --accent-strong: #9ef199;
        --grid-line: rgba(105, 190, 130, 0.15);
        --card-face: rgba(255, 255, 255, 0.95);
        --hud-text: #134b2b;
        --danger: #e74c3c;
        --success: #2f9e44;
        --info: #0f9c9c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Pretendard", system-ui, sans-serif;
        background:
          radial-gradient(circle at 15% 10%, rgba(190, 255, 210, 0.8), transparent 55%),
          radial-gradient(circle at 75% 0%, rgba(255, 255, 255, 0.9), transparent 45%),
          radial-gradient(circle at 50% 85%, rgba(216, 255, 228, 0.85), transparent 50%),
          var(--bg);
        color: #1c2f1d;
      }

      #app {
        width: min(1400px, 100%);
        margin: 0 auto;
        padding: 1.75rem clamp(1rem, 3.5vw, 2.25rem) 3.5rem;
      }

      .logo-title {
        text-align: center;
        margin-bottom: 1.5rem;
      }

      .logo-title h1 {
        font-family: "Orbitron", "Pretendard", sans-serif;
        letter-spacing: 0.12em;
        font-size: clamp(1.4rem, 3.5vw, 2.6rem);
        color: #0f5132;
        margin: 0.5rem 0 0;
        text-transform: uppercase;
      }

      .logo-title p {
        margin: 0;
        color: rgba(19, 66, 38, 0.7);
      }

      .logo-actions {
        margin-top: 1rem;
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .guide-gallery {
        background: var(--panel);
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        padding: clamp(1rem, 3vw, 1.75rem);
        box-shadow: 0 18px 38px rgba(108, 185, 138, 0.2);
        margin-bottom: 1.25rem;
      }

      .guide-gallery h2 {
        margin: 0 0 0.75rem;
        font-size: 1.15rem;
        color: #0f5132;
        letter-spacing: 0.05em;
      }

      .collapsible {
        display: grid;
        gap: 0.5rem;
      }

      .collapse-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      [data-collapsible-content][hidden] {
        display: none;
      }

      .guide-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.8rem;
      }

      .guide-card {
        border-radius: 16px;
        padding: 1rem 1.1rem;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(167, 243, 208, 0.25));
        border: 1px solid rgba(19, 66, 38, 0.1);
        box-shadow: 0 12px 26px rgba(116, 218, 114, 0.25);
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .guide-card h3 {
        margin: 0;
        font-size: 1rem;
        color: #0f5132;
      }

      .guide-card .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.65rem;
        background: rgba(15, 156, 156, 0.08);
        border: 1px solid rgba(15, 156, 156, 0.18);
        border-radius: 999px;
        font-size: 0.8rem;
        color: #0f5132;
      }

      .guide-card p {
        margin: 0;
        color: rgba(19, 66, 38, 0.78);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .guide-card ul {
        margin: 0.2rem 0 0;
        padding-left: 1rem;
        color: rgba(19, 66, 38, 0.82);
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .guide-card.highlight {
        background: linear-gradient(135deg, rgba(255, 245, 240, 0.9), rgba(255, 210, 210, 0.4));
        border-color: rgba(231, 76, 60, 0.2);
        box-shadow: 0 12px 26px rgba(231, 76, 60, 0.25);
      }

      .lobby-grid {
        display: grid;
        gap: 1.25rem;
      }

      @media (min-width: 720px) {
        .lobby-grid {
          grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }
      }

      .room-card {
        background: var(--panel);
        border-radius: 18px;
        border: 1px solid var(--panel-border);
        padding: 1.5rem;
        box-shadow: 0 25px 55px rgba(91, 140, 106, 0.2);
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .room-card h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .room-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: rgba(19, 66, 38, 0.75);
      }

      .btn {
        font: inherit;
        border: none;
        border-radius: 10px;
        padding: 0.7rem 1.2rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(120deg, var(--accent), var(--accent-strong));
        color: #0f2f1b;
        font-weight: 600;
      }

      .btn-primary:hover:enabled {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(116, 218, 114, 0.45);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-ghost {
        background: transparent;
        border: 1px solid rgba(19, 66, 38, 0.25);
        color: rgba(19, 66, 38, 0.9);
      }

      .room-info-chip {
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(19, 66, 38, 0.65);
      }

      .game-layout {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        position: relative;
        align-items: center;
        width: 100%;
      }

      .board-stage {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 100%;
        align-items: center;
      }

      .hud-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(260px, 1fr));
        gap: 0.85rem;
        width: 100%;
        max-width: 1100px;
      }

      @media (max-width: 960px) {
        .hud-grid {
          grid-template-columns: 1fr;
          max-width: 800px;
        }
      }

      .hud-panel {
        background: var(--panel);
        border-radius: 16px;
        border: 1px solid var(--panel-border);
        padding: 0.85rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        box-shadow: 0 12px 28px rgba(108, 185, 138, 0.18);
        height: 100%;
      }

      .hud-panel.active {
        border-color: var(--accent);
        box-shadow: 0 0 25px rgba(255, 191, 85, 0.25);
      }

      .hud-panel h3 {
        margin: 0;
        font-size: 0.9rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(19, 66, 38, 0.85);
      }

      .hud-panel strong {
        font-size: 1.05rem;
        color: var(--hud-text);
      }



      .hud-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.4rem;
      }

      .player-meta {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.65rem;
      }

      .ability-text {
        font-size: 0.85rem;
        color: rgba(19, 66, 38, 0.72);
        line-height: 1.45;
      }

      .turn-tools {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
        background: rgba(116, 218, 114, 0.06);
        border: 1px solid rgba(116, 218, 114, 0.16);
        border-radius: 12px;
        padding: 0.65rem 0.75rem;
      }

      .turn-meta-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .player-color {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        font-size: 0.9rem;
      }

      .player-name {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      .player-name span {
        font-size: 0.8rem;
        color: rgba(19, 66, 38, 0.7);
      }

      .swatch {
        width: 0.85rem;
        height: 0.85rem;
        border-radius: 50%;
        border: 2px solid rgba(19, 66, 38, 0.25);
      }

      .progress {
        width: 100%;
        height: 6px;
        background: rgba(19, 66, 38, 0.1);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress span {
        display: block;
        height: 100%;
        border-radius: 999px;
      }

      .hud-panel .meta {
        font-size: 0.85rem;
        color: rgba(19, 66, 38, 0.75);
      }

      .status-line {
        padding: 0.45rem 0.55rem;
        border-radius: 10px;
        background: rgba(116, 218, 114, 0.12);
        font-size: 0.85rem;
      }

      .locked-info {
        font-size: 0.8rem;
        color: rgba(19, 66, 38, 0.7);
      }

      .calc-panel {
        display: grid;
        gap: 0.35rem;
        background: rgba(15, 156, 156, 0.06);
        border: 1px dashed rgba(15, 156, 156, 0.2);
        border-radius: 10px;
        padding: 0.55rem 0.65rem;
      }

      .calc-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        font-size: 0.88rem;
        color: rgba(19, 66, 38, 0.82);
      }

      .calc-row.muted {
        color: rgba(19, 66, 38, 0.7);
        font-weight: 600;
      }

      .hearts {
        display: flex;
        gap: 0.3rem;
      }

      .heart {
        width: 16px;
        height: 14px;
        background: rgba(19, 66, 38, 0.12);
        clip-path: path("M8 14s-6-3.9-6-8.1C2 3 3.8 1 6 1c1.4 0 2.3 0.9 2 1.5C8.7 1.9 9.6 1 11 1c2.2 0 4 2 4 4.9C15 10.1 8 14 8 14z");
      }

      .heart.full {
        background: #ff5c8d;
      }

      .board-wrapper {
        grid-area: board;
        background: var(--card-face);
        border-radius: 24px;
        border: 1px solid rgba(19, 66, 38, 0.08);
        padding: clamp(0.85rem, 2.4vw, 1.25rem);
        box-shadow: inset 0 0 32px rgba(116, 218, 114, 0.14), 0 20px 30px rgba(109, 174, 128, 0.22);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        align-items: stretch;
        width: min(100%, 1100px);
        margin: 0 auto;
      }

      .board-area {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        align-items: center;
      }

      .board-shell {
        position: relative;
        width: min(100%, 1100px);
        max-width: 1100px;
        margin: 0 auto;
      }

      .board-grid {
        width: 100%;
        aspect-ratio: 1;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        grid-template-rows: repeat(20, 1fr);
        gap: 1px;
        background: var(--grid-line);
        border: 1px solid rgba(19, 66, 38, 0.12);
        position: relative;
      }

      .cell {
        background: rgba(255, 255, 255, 0.95);
        position: relative;
        cursor: pointer;
      }

      .cell:nth-child(odd) {
        background: rgba(231, 255, 238, 0.9);
      }

      .token {
        position: absolute;
        inset: 3px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        font-weight: 600;
        background: rgba(116, 218, 114, 0.2);
        border: 2px solid rgba(116, 218, 114, 0.35);
        color: #0d3a1f;
      }

      .token.shielded {
        border-color: #5ef0ff;
        box-shadow: 0 0 0 2px rgba(94, 240, 255, 0.6), 0 0 18px rgba(94, 240, 255, 0.7);
      }

      .token::after {
        content: attr(data-label);
      }

      .bullet-marker {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: 1px solid rgba(19, 66, 38, 0.4);
        background: currentColor;
        bottom: 4px;
        right: 4px;
      }

      .card-visuals {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .card-actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.35rem;
        margin-top: 0.35rem;
        overflow-x: auto;
      }

      .card-actions .btn {
        flex: 1;
        min-width: 110px;
        background: rgba(19, 66, 38, 0.05);
        border: 1px solid rgba(19, 66, 38, 0.15);
      }

      .card-visuals.compact .card-slot {
        min-width: 70px;
        min-height: 60px;
      }

      .card-slot {
        min-width: 56px;
        min-height: 64px;
        border-radius: 12px;
        border: 1px dashed rgba(19, 66, 38, 0.2);
        background: rgba(255, 255, 255, 0.75);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.2rem;
        color: #134b2b;
        position: relative;
        padding: 0.35rem;
      }

      .card-slot strong {
        font-size: 1rem;
      }

      .card-slot.badge::after {
        content: "보류";
        position: absolute;
        top: 6px;
        right: 6px;
        font-size: 0.65rem;
        background: rgba(15, 156, 156, 0.1);
        color: #0f9c9c;
        padding: 0.1rem 0.35rem;
        border-radius: 999px;
        border: 1px solid rgba(15, 156, 156, 0.2);
      }

      .ability-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }

      .ability-buttons button {
        flex: 1;
      }

      .hold-display {
        font-size: 0.85rem;
        background: rgba(15, 156, 156, 0.08);
        border: 1px dashed rgba(15, 156, 156, 0.2);
        border-radius: 12px;
        padding: 0.4rem 0.6rem;
      }

      .hazard-circle {
        position: absolute;
        border: 2px dotted rgba(15, 156, 156, 0.65);
        border-radius: 50%;
        pointer-events: none;
        mix-blend-mode: multiply;
      }

      .hazard-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .origin-options {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        font-size: 0.8rem;
      }

      .origin-options button {
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(19, 66, 38, 0.2);
        background: rgba(255, 255, 255, 0.65);
        color: inherit;
        cursor: pointer;
      }

      .origin-options button.active {
        border-color: var(--accent);
        color: #0f5132;
        background: rgba(116, 218, 114, 0.35);
      }

      .feedback {
        font-size: 0.85rem;
        color: rgba(19, 66, 38, 0.8);
      }

      .log-panel {
        padding-top: 0.1rem;
        font-size: 0.85rem;
        max-height: 280px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }

      .log-panel span {
        color: rgba(19, 66, 38, 0.7);
      }

      .rules-panel {
        font-size: 0.85rem;
        line-height: 1.5;
        color: rgba(19, 66, 38, 0.7);
      }

      .board-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 0.75rem;
      }

      .summary-card {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(19, 66, 38, 0.12);
        border-radius: 14px;
        padding: 0.75rem 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        box-shadow: 0 14px 30px rgba(116, 218, 114, 0.18);
      }

      .summary-card strong {
        font-size: 1.2rem;
        color: #0f5132;
      }

      .turn-tools {
        margin-top: 0.75rem;
        padding: 0.85rem 0.9rem;
        border-radius: 14px;
        border: 1px solid rgba(19, 66, 38, 0.12);
        background: rgba(255, 255, 255, 0.8);
        display: grid;
        gap: 0.65rem;
      }

      .turn-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }

      .meta-pill {
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        background: rgba(15, 156, 156, 0.08);
        border: 1px solid rgba(15, 156, 156, 0.2);
        font-size: 0.85rem;
      }

      .turn-tools .card-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.5rem;
        align-items: center;
        overflow-x: auto;
      }

      .action-buttons {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.35rem;
      }

      .action-buttons .btn {
        flex: 1;
        min-width: 110px;
      }

      @media (max-width: 960px) {
        .board-grid {
          width: 100%;
        }
      }

      footer {
        text-align: center;
        margin-top: 2rem;
        color: rgba(19, 66, 38, 0.45);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <template id="game-template">
      <div class="logo-title">
        <p>수학 원리를 이용한</p>
        <h1>서바이벌 게임</h1>
        <div class="logo-actions">
          <button class="btn btn-primary" data-randomize>캐릭터 선택</button>
        </div>
      </div>
      <section class="guide-gallery collapsible">
        <div class="collapse-actions">
          <h2>게임 방법 안내</h2>
          <button class="btn btn-ghost" data-collapse-toggle="rules">접어두기</button>
        </div>
        <div class="guide-grid" data-collapsible-content="rules">
          <article class="guide-card">
            <span class="pill">규칙 1</span>
            <h3>무작위 캐릭터 선정</h3>
            <p>게임 시작 전에 각 플레이어에게 캐릭터가 무작위로 1개씩 배정됩니다.</p>
            <ul>
              <li>캐릭터 선택 버튼으로 전체 캐릭터를 자동 배분</li>
              <li>배정 후 각 캐릭터의 고유 능력 확인</li>
            </ul>
          </article>
          <article class="guide-card">
            <span class="pill">규칙 2</span>
            <h3>카드 선택 방법</h3>
            <p>플레이어는 두 가지 선택지 중 하나로 카드를 뽑아 최종 숫자를 만듭니다.</p>
            <ul>
              <li>숫자 카드 두 개를 뽑기</li>
              <li>숫자 카드 한 개 + 각도 카드 한 개 뽑기</li>
            </ul>
          </article>
          <article class="guide-card">
            <span class="pill">규칙 3</span>
            <h3>최종 숫자 계산</h3>
            <p>뽑은 카드 조합에 따라 합산 또는 나눗셈으로 최종 숫자를 계산합니다.</p>
            <ul>
              <li>숫자 두 개: 숫자1 + 숫자2</li>
              <li>숫자 + 각도: 숫자 / cos(각도)</li>
              <li>cos(90°)이 나오면 한 방향 직선으로 자유 이동 가능</li>
            </ul>
          </article>
          <article class="guide-card">
            <span class="pill">규칙 4</span>
            <h3>최종 숫자 활용</h3>
            <p>계산된 숫자를 이동이나 사격에 자유롭게 분배하여 사용합니다.</p>
            <ul>
              <li>이동: 숫자만큼 칸을 이동</li>
              <li>사격: 상대방이 없는 칸을 지정해 공격 또는 총알 고정</li>
            </ul>
          </article>
          <article class="guide-card">
            <span class="pill">규칙 5</span>
            <h3>총알 고정 시스템</h3>
            <p>사격이 빗나가면 지정 칸에 총알이 고정되어 이후 턴부터 발사 기점으로 활용됩니다.</p>
            <ul>
              <li>빈 칸에만 고정 가능</li>
              <li>고정된 총알 방향으로만 상대 사격 허용</li>
              <li>고정된 총알을 발사하면 해당 고정은 소멸</li>
            </ul>
          </article>
          <article class="guide-card highlight">
            <span class="pill">규칙 6</span>
            <h3>사격 제한 규칙</h3>
            <p>한 번 사격당한 캐릭터는 다음 차례에 바로 사격할 수 없습니다.</p>
            <ul>
              <li>사격 피해를 받은 턴 이후 1턴 동안 사격 불가</li>
              <li>이동 등 다른 행동은 정상적으로 진행</li>
            </ul>
          </article>
        </div>
      </section>
      <section class="guide-gallery collapsible">
        <div class="collapse-actions">
          <h2>캐릭터 능력 안내</h2>
          <button class="btn btn-ghost" data-collapse-toggle="characters">접어두기</button>
        </div>
        <div class="guide-grid" data-character-grid data-collapsible-content="characters"></div>
      </section>
      <section class="game-layout" data-game></section>
    </template>

    <script>
      const mainRoom = {
        id: 1,
        title: "메인 전장",
        desc: "도시 전체가 주시하는 본 작전 구역.",
      };

      const characterDeck = [
        {
          name: "파스칼",
          ability: "뺄셈·곱셈 트릭",
          lives: 4,
          detail:
            "상대를 한 장만 뽑게 만들거나, 이번 턴에 숫자 한 장을 추가로 뽑고 다음 턴엔 한 장 덜 뽑는다. 각 능력 2회 사용 가능.",
          power: { key: "pascal" },
        },
        {
          name: "뉴턴",
          ability: "중력",
          lives: 4,
          detail:
            "숫자 카드 하나의 값을 사용해 원하는 말을 일직선으로 밀어낸다. 직접적인 체력 손실은 주지 않는다.",
          power: { key: "newton" },
        },
        {
          name: "피타고라스",
          ability: "피타고라스 세트 질주",
          lives: 5,
          detail:
            "숫자 2장을 뽑아 3·4·5 또는 6·8·10 세트 중 두 장이 나오면 각각 15칸, 20칸 이동한다.",
          power: { key: "pythagoras" },
        },
        {
          name: "갈루아",
          ability: "주기 보호막",
          lives: 3,
          detail: "자신의 차례마다 2턴 주기로 보호막을 전개해 총알 피해를 무효화한다.",
          power: { key: "galois" },
        },
        {
          name: "라마누잔",
          ability: "숫자 보류",
          lives: 4,
          detail:
            "1·7·2·8을 보류해 합산(≤20)으로 쓰거나 4장을 모두 모으면 모두의 체력을 1씩 감소시킨다.",
          power: { key: "ramanujan" },
        },
        {
          name: "갈릴레이",
          ability: "원형 위협",
          lives: 4,
          detail: "고정 탄환을 중심으로 뽑은 숫자만큼의 반지름 점선 원을 자신의 다음 턴까지 펼친다.",
          power: { key: "galileo" },
        },
      ];

      const BOARD_SIZE = 20;

      const basePlayers = [
        {
          id: "red",
          slot: "south",
          colorLabel: "빨",
          colorCode: "#f87171",
          start: { x: BOARD_SIZE - 1, y: BOARD_SIZE - 1 },
        },
        {
          id: "yellow",
          slot: "east",
          colorLabel: "노",
          colorCode: "#facc15",
          start: { x: BOARD_SIZE - 1, y: 0 },
        },
        {
          id: "blue",
          slot: "north",
          colorLabel: "파",
          colorCode: "#38bdf8",
          start: { x: 0, y: 0 },
        },
        {
          id: "green",
          slot: "west",
          colorLabel: "초",
          colorCode: "#34d399",
          start: { x: 0, y: BOARD_SIZE - 1 },
        },
      ];

      const numberCardWeights = [
        { value: 1, count: 4 },
        { value: 2, count: 5 },
        { value: 3, count: 6 },
        { value: 4, count: 7 },
        { value: 5, count: 8 },
        { value: 6, count: 8 },
        { value: 7, count: 7 },
        { value: 8, count: 6 },
        { value: 9, count: 5 },
        { value: 10, count: 4 },
      ];

      const angleCardWeights = [
        { value: 0, count: 4 },
        { value: 30, count: 7 },
        { value: 45, count: 7 },
        { value: 60, count: 7 },
        { value: 90, count: 3 },
      ];

      const NUMBER_DECK_TOTAL = numberCardWeights.reduce((sum, card) => sum + card.count, 0);
      const ANGLE_DECK_TOTAL = angleCardWeights.reduce((sum, card) => sum + card.count, 0);

      const state = {
        selectedRoom: mainRoom,
        players: [],
        piles: { number: NUMBER_DECK_TOTAL, angle: ANGLE_DECK_TOTAL },
        turn: { freeMoveMode: false, freeMoveDirection: null, shootSilenced: false },
        logs: [],
        charactersAssigned: false,
        boardSize: BOARD_SIZE,
        collapsedSections: { rules: true, characters: true },
      };

      const app = document.getElementById("app");
      const gameTemplate = document.getElementById("game-template");

      function placePiecesAtCorners(players) {
        players.forEach((player) => {
          const base = basePlayers.find((p) => p.id === player.id);
          if (base) {
            player.position = { ...base.start };
          }
        });
      }

      function resetGameState() {
        state.players = basePlayers.map((p) => ({
          ...p,
          character: "-",
          ability: "능력 대기중",
          detail: "",
          maxLives: 3,
          lives: 3,
          progress: 0,
          statusText: "캐릭터 선택 대기",
          lockedShots: [],
          power: {},
          turnsTaken: 0,
          shieldActive: false,
          stashedNumbers: [],
          nextDrawPenalty: 0,
          penaltyAppliesOnTurn: 0,
          forcedSingleDraw: false,
          pascalSubUsed: 0,
          pascalMulUsed: 0,
          hazardHitTurn: -1,
          shootCooldown: 0,
          shootSilenced: false,
        }));
        placePiecesAtCorners(state.players);
        state.piles = { number: NUMBER_DECK_TOTAL, angle: ANGLE_DECK_TOTAL };
        state.turn = {
          currentPlayerIndex: 0,
          phase: "pre-character",
          drawnCards: [],
          result: 0,
          remainingValue: 0,
          pendingAction: null,
          selectedOrigin: "self",
          feedback: "캐릭터 선택 버튼을 눌러 무작위로 배치하세요.",
          drawSummary: "-",
          mode: null,
          extraNumberThisTurn: 0,
          holdMode: false,
          selectedTarget: null,
          gravityTarget: null,
          cardPickMode: null,
          gravityValue: null,
          shootSilenced: false,
        };
        state.logs = [];
        state.charactersAssigned = false;
        state.selectedRoom = mainRoom;
        state.hazards = [];
        state.turnCount = 0;
      }

      resetGameState();

      function renderGame() {
        const view = gameTemplate.content.cloneNode(true);

        view.querySelector("[data-randomize]").addEventListener("click", () => {
          assignCharacters();
          render();
        });

        const characterGrid = view.querySelector("[data-character-grid]");
        if (characterGrid) {
          characterGrid.innerHTML = renderCharacterCards();
        }

        const layout = view.querySelector("[data-game]");
        const hudBySlot = Object.fromEntries(
          state.players.map((player, index) => [player.slot, createHud(player, index)])
        );
        const hudPanels = [
          hudBySlot.north,
          hudBySlot.east,
          hudBySlot.south,
          hudBySlot.west,
        ]
          .filter(Boolean)
          .join("");

        layout.innerHTML = `
          <div class="board-stage">
            <div class="hud-grid">${hudPanels}</div>
            ${createBoard()}
          </div>
        `;

        bindGameEvents(view);
        bindCollapsibles(view);
        app.replaceChildren(view);
      }

      function renderCharacterCards() {
        return characterDeck
          .map(
            (character, idx) => `
              <article class="guide-card">
                <span class="pill">캐릭터 ${idx + 1}</span>
                <h3>${character.name}</h3>
                <p>${character.ability}</p>
                <ul>
                  <li>능력 설명: ${character.detail}</li>
                  <li>기본 체력: ${character.lives}♥</li>
                </ul>
              </article>
            `
          )
          .join("");
      }

      function createHud(player, index) {
        const positionClass = `hud-${player.slot}`;
        const hearts = Array.from({ length: player.maxLives }, (_, idx) =>
          `<span class="heart ${idx < player.lives ? "full" : ""}"></span>`
        ).join("");
        const isActive = index === state.turn.currentPlayerIndex && player.lives > 0;
        const activeTools = isActive ? renderActiveTools(player) : "";
        return `
          <article class="hud-panel ${positionClass} ${isActive ? "active" : ""}">
            <div class="hud-header">
              <div>
                <div class="room-info-chip">ROOM ${state.selectedRoom?.id ?? "-"}</div>
                <h3>${player.slot.toUpperCase()} · ${player.colorLabel}</h3>
              </div>
              <div class="player-color">
                <span class="swatch" style="background:${player.colorCode}"></span>
                <div class="player-name">
                  <strong>${player.character}</strong>
                  <span>${player.ability}</span>
                </div>
              </div>
            </div>
            <div class="player-meta">
              <div class="ability-text">${player.detail || "-"}</div>
              <div class="hearts">${hearts}</div>
            </div>
            ${activeTools}
          </article>
        `;
      }

      function renderActiveTools(player) {
        return `
          <div class="turn-tools">
            <div class="turn-meta-row">
              <span class="meta-pill">최근 뽑은 카드</span>
              <div class="card-visuals compact">${renderCardSlots()}</div>
            </div>
            <div class="calc-panel">
              <div class="calc-row"><span>포인트 계산</span><strong>${
                state.turn.drawSummary || "-"
              }</strong></div>
              <div class="calc-row muted"><span>잔여 포인트</span><strong>${
                state.turn.remainingValue
              }</strong></div>
            </div>
            ${renderCardActions()}
            ${createHoldDisplay()}
            ${createAbilityButtons()}
            <div class="card-row">
              <button class="btn btn-primary" data-draw="double">숫자 2장</button>
              <button class="btn btn-primary" data-draw="mix">숫자 + 각도</button>
            </div>
            <div class="action-buttons">
              <button class="btn btn-ghost" data-action="move">이동</button>
              <button class="btn btn-ghost" data-action="shoot-self">사격(본인)</button>
              <button class="btn btn-ghost" data-action="shoot-locked" ${
                player.lockedShots.length ? "" : "disabled"
              }>사격(고정)</button>
              <button class="btn btn-primary" data-end-turn>턴 종료</button>
            </div>
            <div class="origin-options" data-origins></div>
            <div class="feedback">${state.turn.feedback}</div>
          </div>
        `;
      }

      function createBoard() {
        const cells = Array.from({ length: state.boardSize * state.boardSize }, (_, idx) => {
          const x = idx % state.boardSize;
          const y = Math.floor(idx / state.boardSize);
          const playerHere = state.players.find(
            (p) => p.lives > 0 && p.position.x === x && p.position.y === y
          );
          const bullets = state.players
            .filter((p) =>
              p.lockedShots.some((shot) => shot.x === x && shot.y === y)
            )
            .map((p) => ({ color: p.colorCode }));

          let content = "";
          if (playerHere) {
            const tokenStyle = `background:${hexToRgba(playerHere.colorCode, 0.4)}; border-color:${playerHere.colorCode};`;
            const shieldClass =
              playerHere.character === "갈루아" && playerHere.shieldActive ? " shielded" : "";
            content += `<span class="token${shieldClass}" style="${tokenStyle}" data-label="${playerHere.colorLabel}"></span>`;
          }
          bullets.forEach((bullet, idx2) => {
            content += `<span class="bullet-marker" style="color:${bullet.color}; bottom:${4 + idx2 * 10}px"></span>`;
          });

          return `<div class="cell" data-cell data-x="${x}" data-y="${y}">${content}</div>`;
        }).join("");
        const current = state.players[state.turn.currentPlayerIndex];
        const turnLabel = current
          ? `${current.character} (${current.colorLabel})`
          : "-";

        return `
          <section class="board-wrapper">
            <div class="board-area">
              <div class="board-shell">
                <div class="board-grid" data-board>${cells}</div>
                <div class="hazard-layer">${renderHazards()}</div>
              </div>
            </div>
            <div class="board-summary">
              <div class="summary-card">
                <span>숫자 카드</span>
                <strong>${state.piles.number}</strong>
              </div>
              <div class="summary-card">
                <span>각도 카드</span>
                <strong>${state.piles.angle}</strong>
              </div>
              <div class="summary-card">
                <span>결과</span>
                <strong>${state.turn.drawSummary}</strong>
              </div>
              <div class="summary-card">
                <span>현재 턴</span>
                <strong>${turnLabel}</strong>
              </div>
            </div>
          </section>
        `;
      }

      function renderLogs() {
        if (!state.logs.length) {
          return '<span>• 로그 없음</span>';
        }
        return state.logs.map((log) => `<span>• ${log}</span>`).join("");
      }

      function renderCardSlots() {
        if (!state.turn.drawnCards.length) {
          return '<div class="card-slot"><span>최근 뽑은 카드 없음</span></div>';
        }
        return state.turn.drawnCards
          .map((card, idx) => {
            const badge = card.held ? "badge" : "";
            const label = card.type === "angle" ? "각도" : "숫자";
            return `<div class="card-slot ${badge}"><span>${label} ${idx + 1}</span><strong>${card.value}</strong></div>`;
          })
          .join("");
      }

      function renderCardActions() {
        if (!state.turn.cardPickMode) return "";
        const selectable = state.turn.drawnCards
          .map((card, idx) => ({ ...card, idx }))
          .filter((card) => card.type === "number" && !card.held);

        if (!selectable.length) return "";

        const labelMap = {
          gravity: "중력에 사용할 카드 선택",
          hold: "보류에 추가할 카드 선택",
          circle: "원 반지름으로 쓸 카드 선택",
        };
        const label = labelMap[state.turn.cardPickMode] ?? "카드 선택";
        const buttons = selectable
          .map(
            (card, idx) =>
              `<button class="btn" data-card-pick="${card.idx}">${label} #${idx + 1}: ${card.value}</button>`
          )
          .join("");

        return `<div><div style="font-size:0.85rem; margin-bottom:0.25rem; color:rgba(19,66,38,0.75);">${label}</div><div class="card-actions">${buttons}</div></div>`;
      }

      function createHoldDisplay() {
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player || (!player.stashedNumbers?.length && player.character !== "라마누잔")) {
          return "";
        }
        const cards = player.stashedNumbers?.length
          ? player.stashedNumbers.join(", ")
          : "보류 없음";
        return `<div class="hold-display">보류 카드: ${cards}</div>`;
      }

      function targetSelector() {
        const current = state.players[state.turn.currentPlayerIndex];
        if (!current) return "";
        const options = state.players
          .filter((p) => p.id !== current.id && p.lives > 0)
          .map(
            (p) =>
              `<option value="${p.id}" ${state.turn.selectedTarget === p.id ? "selected" : ""}>${p.character}</option>`
          );
        if (!options.length) return "";
        if (!state.turn.selectedTarget) {
          state.turn.selectedTarget = state.players.find((p) => p.id !== current.id && p.lives > 0)?.id ?? null;
        }
        return `
          <label style="font-size:0.85rem; display:flex; gap:0.4rem; align-items:center;">
            대상
            <select data-target-choice>${options.join("")}</select>
          </label>
        `;
      }

      function createAbilityButtons() {
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player) return "";
        const buttons = [];

        if (player.character === "파스칼") {
          const targetPick = targetSelector();
          buttons.push(
            `<button class="btn btn-ghost" data-ability="pascal-sub" ${
              player.pascalSubUsed >= 2 || state.turn.phase !== "await-draw" ? "disabled" : ""
            }>뺄셈(남은 ${2 - player.pascalSubUsed})</button>`
          );
          buttons.push(
            `<button class="btn btn-ghost" data-ability="pascal-mul" ${
              player.pascalMulUsed >= 2 || state.turn.phase !== "await-draw" ? "disabled" : ""
            }>곱셈(남은 ${2 - player.pascalMulUsed})</button>`
          );
          return `<div class="ability-buttons">${targetPick ?? ""}${buttons.join("")}</div>`;
        }

        if (player.character === "뉴턴") {
          buttons.push(
            `<button class="btn btn-ghost" data-ability="gravity" ${
              state.turn.phase === "await-draw" || state.turn.remainingValue <= 0 ? "disabled" : ""
            }>중력 발동</button>`
          );
        }

        if (player.character === "라마누잔") {
          buttons.push(
            `<button class="btn btn-ghost ${state.turn.holdMode ? "active" : ""}" data-ability="toggle-hold">보류 모드</button>`
          );
          if (player.stashedNumbers.length && player.stashedNumbers.reduce((a, b) => a + b, 0) <= 20) {
            buttons.push(
              `<button class="btn btn-primary" data-ability="use-hold">보류 합산 사용</button>`
            );
          }
          const hasSet = [1, 2, 7, 8].every((n) => player.stashedNumbers.includes(n));
          if (hasSet) {
            buttons.push(
              `<button class="btn btn-primary" data-ability="collapse">1·7·2·8 발동</button>`
            );
          }
        }

        if (player.character === "갈릴레이") {
          const hasLock = player.lockedShots.length > 0;
          buttons.push(
            `<button class="btn btn-ghost" data-ability="circle" ${
              state.turn.phase === "await-draw" || !hasLock ? "disabled" : ""
            }>원 생성</button>`
          );
        }

        if (!buttons.length) return "";
        return `<div class="ability-buttons">${targetSelector() ?? ""}${buttons.join("")}</div>`;
      }

      function renderHazards() {
        if (!state.hazards?.length) return "";
        const size = 100 / state.boardSize;
        return state.hazards
          .map((h) => {
            const left = (h.center.x + 0.5) * size;
            const top = (h.center.y + 0.5) * size;
            const radius = h.radius * size;
            const diameter = radius * 2;
            return `<div class="hazard-circle" style="width:${diameter}%; height:${diameter}%; left:${left - radius}%; top:${top - radius}%;"></div>`;
          })
          .join("");
      }

      function bindGameEvents(view) {
        const board = view.querySelector("[data-board]");
        board?.addEventListener("click", handleBoardClick);

        view.querySelectorAll("[data-draw]").forEach((btn) => {
          btn.addEventListener("click", () => {
            handleDraw(btn.dataset.draw);
          });
        });

        view.querySelectorAll("[data-action]").forEach((btn) => {
          btn.addEventListener("click", () => {
            handleAction(btn.dataset.action);
          });
        });

        view.querySelectorAll("[data-ability]").forEach((btn) => {
          btn.addEventListener("click", () => {
            handleAbility(btn.dataset.ability, btn.dataset.circleValue);
          });
        });

        view.querySelectorAll("[data-card-pick]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = Number(btn.dataset.cardPick);
            handleCardPick(idx);
          });
        });

        const targetSelect = view.querySelector("[data-target-choice]");
        if (targetSelect) {
          targetSelect.addEventListener("change", (event) => {
            state.turn.selectedTarget = event.target.value;
          });
        }

        view.querySelector("[data-end-turn]")?.addEventListener("click", endTurn);

        const originWrap = view.querySelector("[data-origins]");
        if (originWrap) {
          originWrap.innerHTML = createOriginButtons();
          originWrap.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => {
              state.turn.selectedOrigin = btn.dataset.origin;
              render();
            });
          });
        }
      }

      function bindCollapsibles(view) {
        state.collapsedSections ??= {};
        view.querySelectorAll("[data-collapse-toggle]").forEach((btn) => {
          const target = btn.dataset.collapseToggle;
          const content = view.querySelector(
            `[data-collapsible-content="${target}"]`
          );
          if (!content) return;

          if (state.collapsedSections[target]) {
            content.setAttribute("hidden", "true");
          }

          const updateLabel = () => {
            btn.textContent = content.hasAttribute("hidden")
              ? "펴두기"
              : "접어두기";
          };

          btn.addEventListener("click", () => {
            const isHidden = content.hasAttribute("hidden");
            if (isHidden) {
              content.removeAttribute("hidden");
              state.collapsedSections[target] = false;
            } else {
              content.setAttribute("hidden", "true");
              state.collapsedSections[target] = true;
            }
            updateLabel();
          });

          updateLabel();
        });
      }

      function createOriginButtons() {
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player) return "";
        if (player.lockedShots.length === 0 && state.turn.selectedOrigin !== "self") {
          state.turn.selectedOrigin = "self";
        }
        if (state.turn.selectedOrigin?.startsWith("lock-")) {
          const idx = Number(state.turn.selectedOrigin.replace("lock-", ""));
          if (!player.lockedShots[idx]) {
            state.turn.selectedOrigin = "self";
          }
        }
        const buttons = [`<button data-origin="self" class="${state.turn.selectedOrigin === "self" ? "active" : ""}">기본 원점</button>`];
        player.lockedShots.forEach((shot, idx) => {
          const id = `lock-${idx}`;
          buttons.push(`<button data-origin="${id}" class="${state.turn.selectedOrigin === id ? "active" : ""}">고정 ${idx + 1}</button>`);
        });
        return buttons.join("");
      }

      function assignCharacters() {
        const deck = [...characterDeck];
        state.players.forEach((player) => {
          const idx = Math.floor(Math.random() * deck.length);
          const pick = deck.splice(idx, 1)[0];
          player.character = pick.name;
          player.ability = pick.ability;
          player.detail = pick.detail;
          player.maxLives = pick.lives;
          player.lives = pick.lives;
          player.power = pick.power;
          player.statusText = "능력 장착 완료";
          player.lockedShots = [];
          player.progress = 0;
          player.turnsTaken = 0;
          player.shieldActive = false;
          player.stashedNumbers = [];
          player.nextDrawPenalty = 0;
          player.penaltyAppliesOnTurn = 0;
          player.forcedSingleDraw = false;
          player.pascalSubUsed = 0;
          player.pascalMulUsed = 0;
          player.hazardHitTurn = -1;
          player.shootCooldown = 0;
          player.shootSilenced = false;
        });
        placePiecesAtCorners(state.players);
        state.charactersAssigned = true;
        state.turn.currentPlayerIndex = 0;
        state.turn.phase = "await-draw";
        state.turn.remainingValue = 0;
        state.turn.drawSummary = "-";
        state.turn.pendingAction = null;
        state.turn.selectedOrigin = "self";
        state.turn.mode = null;
        state.turn.extraNumberThisTurn = 0;
        state.turn.holdMode = false;
        state.turn.selectedTarget = null;
        state.turn.cardPickMode = null;
        state.turn.gravityValue = null;
        state.hazards = [];
        state.turnCount = 0;
        state.turn.drawnCards = [];
        state.turn.result = 0;
        state.turn.freeMoveMode = false;
        state.turn.freeMoveDirection = null;
        state.turn.shootSilenced = false;
        const current = state.players[state.turn.currentPlayerIndex];
        current.turnsTaken = 1;
        current.shieldActive = current.character === "갈루아" && current.turnsTaken % 2 === 0;
        if (current.shieldActive) {
          logEvent(`${current.character}가 보호막을 전개했습니다.`);
        }
        state.turn.feedback = `${current.character}의 차례입니다. 카드를 뽑으세요.`;
        logEvent("모든 플레이어에게 무작위 캐릭터가 배정되었습니다.");
      }

      function handleDraw(mode) {
        if (!state.charactersAssigned) {
          state.turn.feedback = "먼저 캐릭터를 선택하세요.";
          render();
          return;
        }
        if (state.turn.phase === "complete") {
          state.turn.feedback = "게임이 종료되었습니다.";
          render();
          return;
        }
        if (state.turn.phase !== "await-draw") {
          state.turn.feedback = "현재 턴에서 이미 카드를 뽑았습니다.";
          render();
          return;
        }
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player || player.lives <= 0) {
          endTurn();
          return;
        }

        state.turn.cardPickMode = state.turn.holdMode ? "hold" : null;
        state.turn.gravityValue = null;

        let numberCardsToDraw = mode === "double" ? 2 : 1;
        let angleCardsToDraw = mode === "mix" ? 1 : 0;

        if (player.forcedSingleDraw) {
          numberCardsToDraw = 1;
          angleCardsToDraw = 0;
          state.turn.feedback = "강제로 숫자 1장만 뽑습니다.";
          player.forcedSingleDraw = false;
        }

        const penaltyReady = (player.penaltyAppliesOnTurn ?? 0) <= state.turnCount;

        if (player.nextDrawPenalty !== 0 && penaltyReady) {
          numberCardsToDraw = Math.max(1, numberCardsToDraw + player.nextDrawPenalty);
          player.nextDrawPenalty = 0;
          player.penaltyAppliesOnTurn = state.turnCount;
        }

        if (state.turn.extraNumberThisTurn > 0) {
          numberCardsToDraw += state.turn.extraNumberThisTurn;
          state.turn.extraNumberThisTurn = 0;
        }

        const drawnCards = [];
        const usableNumbers = [];
        let summaryParts = [];

        for (let i = 0; i < numberCardsToDraw; i += 1) {
          const num = drawNumber();
          const isHoldable = player.character === "라마누잔" && [1, 2, 7, 8].includes(num) && state.turn.holdMode;
          if (isHoldable) {
            player.stashedNumbers.push(num);
            drawnCards.push({ type: "number", value: num, held: true });
            summaryParts.push(`${num}(보류)`);
          } else {
            usableNumbers.push(num);
            drawnCards.push({ type: "number", value: num, held: false });
            summaryParts.push(`${num}`);
          }
        }
        state.piles.number = Math.max(0, state.piles.number - numberCardsToDraw);

        let angleValue = null;
        if (angleCardsToDraw) {
          angleValue = drawAngle();
          drawnCards.push({ type: "angle", value: angleValue, held: false });
          state.piles.angle = Math.max(0, state.piles.angle - 1);
          summaryParts.push(`cos(${angleValue}°)`);
        }

        let result = 0;
        let summary = "";
        if (mode === "double") {
          const total = usableNumbers.reduce((a, b) => a + b, 0);
          result = total;
          summary = `숫자 ${summaryParts.join(" + ")} ⇒ ${result}`;
          if (player.character === "피타고라스") {
            const drawnNumbers = drawnCards
              .filter((c) => c.type === "number" && !c.held)
              .map((c) => c.value);
            if (drawnNumbers.length === 2) {
              const pythSets = [
                { label: "3·4·5", numbers: new Set([3, 4, 5]), move: 15 },
                { label: "6·8·10", numbers: new Set([6, 8, 10]), move: 20 },
              ];
              const matched = pythSets.find((set) => drawnNumbers.every((n) => set.numbers.has(n)));
              if (matched) {
                result = matched.move;
                summary = `피타고라스 세트(${matched.label}) 적중! ${matched.move}칸 이동`;
              }
            }
          }
        } else {
          const baseNumber = usableNumbers[0] ?? 0;
          const cosValue = Math.cos((angleValue * Math.PI) / 180);
          let calc = cosValue === 0 ? baseNumber : baseNumber / cosValue;
          calc = Number(calc.toFixed(2));
          result = calc;
          summary = `숫자 ${baseNumber} / cos(${angleValue}°) = ${calc}`;
        }

        result = Math.max(1, Math.round(Math.abs(result)));
        state.turn.freeMoveMode = angleValue === 90 && mode === "single";
        state.turn.freeMoveDirection = null;
        if (state.turn.freeMoveMode) {
          summary = `숫자 ${baseNumber} / cos(90°) → 한 방향 자유 이동`;
        }
        state.turn.drawSummary = summary;
        state.turn.result = result;
        state.turn.remainingValue = result;
        state.turn.mode = mode;
        state.turn.phase = "action";
        state.turn.pendingAction = null;
        state.turn.selectedOrigin = "self";
        state.turn.drawnCards = drawnCards;
        state.turn.feedback = "이동 또는 사격 버튼을 눌러 좌표를 선택하세요.";
        render();
      }

      function weightedDraw(weights) {
        const total = weights.reduce((sum, card) => sum + card.count, 0);
        let pick = Math.random() * total;
        for (const card of weights) {
          pick -= card.count;
          if (pick < 0) return card.value;
        }
        return weights[weights.length - 1].value;
      }

      function drawNumber() {
        return weightedDraw(numberCardWeights);
      }

      function drawAngle() {
        return weightedDraw(angleCardWeights);
      }

      function handleAbility(type, value) {
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player || player.lives <= 0) return;

        if (type === "pascal-sub") {
          if (player.pascalSubUsed >= 2 || state.turn.phase !== "await-draw") return;
          const target = state.players.find((p) => p.id === state.turn.selectedTarget && p.lives > 0);
          if (!target) {
            state.turn.feedback = "지목할 대상이 없습니다.";
            render();
            return;
          }
          target.forcedSingleDraw = true;
          player.nextDrawPenalty -= 1;
          player.penaltyAppliesOnTurn = state.turnCount + 1;
          player.pascalSubUsed += 1;
          player.statusText = `${target.character} 다음 드로우 1장 제한`;
          state.turn.feedback = "다음 턴 제한을 걸었습니다.";
          logEvent(`파스칼이 ${target.character}에게 뺄셈 페널티를 부여했습니다.`);
          render();
          return;
        }

        if (type === "pascal-mul") {
          if (player.pascalMulUsed >= 2 || state.turn.phase !== "await-draw") return;
          player.pascalMulUsed += 1;
          state.turn.extraNumberThisTurn += 1;
          player.nextDrawPenalty -= 1;
          player.penaltyAppliesOnTurn = state.turnCount + 1;
          player.statusText = "이번 턴 숫자 +1, 다음 턴 -1";
          state.turn.feedback = "추가 숫자 카드가 적용됩니다.";
          logEvent("파스칼이 곱셈 능력을 사용해 숫자를 추가합니다.");
          render();
          return;
        }

        if (type === "gravity") {
          if (state.turn.phase === "await-draw" || state.turn.remainingValue <= 0) return;
          const target = state.players.find((p) => p.id === state.turn.selectedTarget && p.lives > 0);
          if (!target) {
            state.turn.feedback = "밀어낼 대상이 없습니다.";
            render();
            return;
          }
          const hasNumberCard = state.turn.drawnCards.some((c) => c.type === "number" && !c.held);
          if (!hasNumberCard) {
            state.turn.feedback = "사용할 수 있는 숫자 카드가 없습니다.";
            render();
            return;
          }
          state.turn.pendingAction = "gravity";
          state.turn.gravityTarget = target.id;
          state.turn.cardPickMode = "gravity";
          state.turn.gravityValue = null;
          state.turn.feedback = `${target.character}을(를) 이동시킬 카드를 고른 뒤 칸을 선택하세요.`;
          render();
          return;
        }

        if (type === "toggle-hold") {
          state.turn.holdMode = !state.turn.holdMode;
          state.turn.cardPickMode = state.turn.holdMode ? "hold" : null;
          state.turn.feedback = state.turn.holdMode
            ? "보류할 카드를 눌러 저장하세요."
            : "보류 모드 해제";
          render();
          return;
        }

        if (type === "use-hold") {
          const sum = (player.stashedNumbers ?? []).reduce((a, b) => a + b, 0);
          if (!sum || sum > 20) {
            state.turn.feedback = "합산할 수 없습니다.";
            render();
            return;
          }
          player.stashedNumbers = [];
          state.turn.remainingValue += sum;
          state.turn.feedback = `보류 합계 ${sum}을 추가했습니다.`;
          logEvent(`라마누잔이 보류 카드 ${sum}을 사용했습니다.`);
          render();
          return;
        }

        if (type === "collapse") {
          const hasSet = [1, 2, 7, 8].every((n) => player.stashedNumbers.includes(n));
          if (!hasSet) return;
          player.stashedNumbers = [];
          state.players.forEach((p) => {
            if (p.lives > 0) {
              applyDamage(p, 1, "라마누잔 발동");
            }
          });
          state.turn.feedback = "모든 캐릭터의 목숨이 1 감소합니다.";
          logEvent("라마누잔이 1·7·2·8 세트를 발동했습니다.");
          render();
          return;
        }

        if (type === "circle") {
          if (state.turn.phase === "await-draw") return;
          const center = player.lockedShots[0];
          if (!center) {
            state.turn.feedback = "고정된 총알이 없습니다.";
            render();
            return;
          }
          if (value === undefined || value === null) {
            const hasNumberCard = state.turn.drawnCards.some((c) => c.type === "number" && !c.held);
            if (!hasNumberCard) {
              state.turn.feedback = "반지름으로 쓸 숫자 카드가 없습니다.";
              render();
              return;
            }
            state.turn.cardPickMode = "circle";
            state.turn.feedback = "반지름으로 사용할 카드를 선택하세요.";
            render();
            return;
          }
          const radius = Number(value ?? 0);
          if (!radius || Number.isNaN(radius)) return;
          if (radius > state.turn.remainingValue) {
            state.turn.feedback = `잔여 포인트 ${state.turn.remainingValue}로는 반지름 ${radius} 원을 만들 수 없습니다.`;
            render();
            return;
          }
          state.hazards.push({
            center: { ...center },
            radius,
            owner: player.id,
            expiresOnOwnerTurn: true,
          });
          state.turn.cardPickMode = null;
          state.turn.remainingValue = Math.max(0, state.turn.remainingValue - radius);
          if (state.turn.remainingValue === 0) {
            state.turn.phase = "await-end";
            state.turn.feedback = `반지름 ${radius} 원이 생성되었습니다. 잔여 포인트가 없습니다.`;
          } else {
            state.turn.phase = "action";
            state.turn.feedback = `반지름 ${radius} 원이 생성되었습니다. 잔여 포인트 ${state.turn.remainingValue}.`;
          }
          logEvent(`갈릴레이가 ${formatCoord(center)}을 중심으로 반지름 ${radius} 원을 전개했습니다.`);
          render();
        }
      }

      function handleCardPick(idx) {
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player) return;
        const card = state.turn.drawnCards[idx];
        if (!card || card.type !== "number" || card.held) return;

        if (state.turn.cardPickMode === "hold" && player.character === "라마누잔") {
          if (![1, 2, 7, 8].includes(card.value)) {
            state.turn.feedback = "1·7·2·8만 보류할 수 있습니다.";
            render();
            return;
          }
          player.stashedNumbers.push(card.value);
          card.held = true;
          state.turn.remainingValue = Math.max(0, state.turn.remainingValue - card.value);
          state.turn.feedback = `${card.value}을(를) 보류했습니다.`;
          if (state.turn.remainingValue === 0) {
            state.turn.phase = "await-end";
            state.turn.feedback = "잔여 포인트가 없습니다. 턴을 종료하세요.";
          }
          render();
          return;
        }

        if (state.turn.cardPickMode === "gravity" && player.character === "뉴턴") {
          state.turn.gravityValue = card.value;
          state.turn.cardPickMode = null;
          state.turn.feedback = `중력 이동 한도를 ${card.value}로 설정했습니다. 이동시킬 칸을 선택하세요.`;
          render();
          return;
        }

        if (state.turn.cardPickMode === "circle" && player.character === "갈릴레이") {
          state.turn.cardPickMode = null;
          handleAbility("circle", card.value);
        }
      }

      function applyDamage(target, amount, reason = "피해") {
        if (!target || target.lives <= 0 || amount <= 0) return false;
        if (target.character === "갈루아" && target.shieldActive) {
          target.statusText = `보호막으로 ${reason} 무효`;
          logEvent(`${target.character}의 보호막이 ${reason}를 막았습니다.`);
          return false;
        }
        target.lives = Math.max(0, target.lives - amount);
        target.statusText = `${reason} (-${amount}) 남은 하트 ${target.lives}`;
        logEvent(`${target.character} ${reason}로 피해 ${amount}`);
        if (reason.includes("사격")) {
          target.shootCooldown = Math.max(1, target.shootCooldown);
          logEvent(`${target.character}가 사격 피해로 다음 턴 사격 불가 상태입니다.`);
        }
        if (target.lives === 0) {
          logEvent(`${target.character} 탈락!`);
          checkForWinner();
        }
        return true;
      }

      function isInsideHazard(point, playerId) {
        return state.hazards
          .filter((h) => h.owner !== playerId)
          .some((h) => {
            const dx = point.x - h.center.x;
            const dy = point.y - h.center.y;
            return Math.sqrt(dx * dx + dy * dy) <= h.radius;
          });
      }

      function applyHazardIfNeeded(player) {
        if (!player || player.lives <= 0) return;
        if (player.hazardHitTurn === state.turnCount) return;
        if (isInsideHazard(player.position, player.id)) {
          player.shootSilenced = true;
          applyDamage(player, 1, "원형 위협");
          player.hazardHitTurn = state.turnCount;
        }
      }

      function handleAction(action) {
        if (!state.charactersAssigned) {
          state.turn.feedback = "캐릭터 선택 후에 진행할 수 있습니다.";
          render();
          return;
        }
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player || player.lives <= 0) {
          state.turn.feedback = "활동할 수 있는 플레이어가 없습니다.";
          endTurn();
          return;
        }
        const isShootAction = action === "shoot-self" || action === "shoot-locked";
        if (state.turn.phase === "await-draw") {
          state.turn.feedback = "카드를 먼저 뽑으세요.";
          render();
          return;
        }
        if (state.turn.phase === "complete") {
          state.turn.feedback = "게임이 종료되었습니다.";
          render();
          return;
        }
        if (isShootAction && player.shootCooldown > 0) {
          state.turn.feedback = "지난 턴 사격 피해로 이번 턴에는 사격할 수 없습니다.";
          render();
          return;
        }
        if (isShootAction && player.shootSilenced) {
          state.turn.feedback = "갈릴레이 원 안에서는 이번 턴 사격할 수 없습니다.";
          render();
          return;
        }
        if (state.turn.remainingValue <= 0) {
          state.turn.feedback = "잔여 포인트가 없습니다. 턴을 종료하세요.";
          render();
          return;
        }
        if (action === "shoot-locked") {
          if (!player.lockedShots.length) {
            state.turn.feedback = "고정된 총알이 없습니다.";
            render();
            return;
          }
          const lockIndex = state.turn.selectedOrigin?.startsWith("lock-")
            ? Number(state.turn.selectedOrigin.replace("lock-", ""))
            : 0;
          state.turn.selectedOrigin = player.lockedShots[lockIndex]
            ? `lock-${lockIndex}`
            : "lock-0";
        }
        if (action === "shoot-self") {
          state.turn.selectedOrigin = "self";
        }
        state.turn.pendingAction = action;
        state.turn.feedback =
          action === "move"
            ? "이동할 칸을 선택하세요."
            : action === "shoot-locked"
              ? "고정된 총알에서 사격할 대상을 선택하세요."
              : "사격할 목표 칸을 선택하세요.";
        render();
      }

      function handleBoardClick(event) {
        const cell = event.target.closest("[data-cell]");
        if (!cell) return;
        if (state.turn.pendingAction === null) {
          state.turn.feedback = "이동 또는 사격 버튼을 눌러주세요.";
          render();
          return;
        }
        const player = state.players[state.turn.currentPlayerIndex];
        if (!player || player.lives <= 0) {
          endTurn();
          return;
        }
        const isShootAction = state.turn.pendingAction?.startsWith("shoot");
        const isLockedShot = state.turn.pendingAction === "shoot-locked";
        const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
        const origin = getOriginCoordinate(player, state.turn.selectedOrigin);
        const selectedLockIndex = state.turn.selectedOrigin?.startsWith("lock-")
          ? Number(state.turn.selectedOrigin.replace("lock-", ""))
          : null;
        const usedLockedOrigin =
          isShootAction && (isLockedShot || state.turn.selectedOrigin?.startsWith("lock-"));
        const moveStart = state.turn.pendingAction === "move" && state.turn.freeMoveMode ? player.position : origin;
        const rawDistance = Math.abs(target.x - moveStart.x) + Math.abs(target.y - moveStart.y);
        if (rawDistance === 0) {
          state.turn.feedback = "같은 칸을 선택할 수 없습니다.";
          render();
          return;
        }

        if (state.turn.pendingAction === "gravity") {
          const pushed = state.players.find((p) => p.id === state.turn.gravityTarget && p.lives > 0);
          if (!pushed) {
            state.turn.feedback = "대상이 더 이상 없습니다.";
            render();
            return;
          }
          if (state.turn.gravityValue === null) {
            state.turn.feedback = "중력에 사용할 카드를 먼저 선택하세요.";
            render();
            return;
          }
          const straightLine = pushed.position.x === target.x || pushed.position.y === target.y;
          if (!straightLine) {
            state.turn.feedback = "한 방향 직선으로만 이동시킬 수 있습니다.";
            render();
            return;
          }
          const distance =
            Math.abs(target.x - pushed.position.x) + Math.abs(target.y - pushed.position.y);
          if (distance === 0) {
            state.turn.feedback = "다른 칸을 선택하세요.";
            render();
            return;
          }
          const maxPush = state.turn.gravityValue ?? state.turn.remainingValue;
          if (distance > maxPush) {
            state.turn.feedback = `선택한 카드 값 ${maxPush}로는 부족합니다.`;
            render();
            return;
          }
          const blocked = state.players.some(
            (p) => p.id !== pushed.id && p.lives > 0 && p.position.x === target.x && p.position.y === target.y
          );
          if (blocked) {
            state.turn.feedback = "그 칸에는 이미 플레이어가 있습니다.";
            render();
            return;
          }
          pushed.position = target;
          player.statusText = `${pushed.character}을(를) 중력으로 이동`;
          logEvent(`뉴턴이 ${pushed.character}을(를) ${formatCoord(target)}로 밀어냈습니다.`);
          state.turn.remainingValue -= distance;
          state.turn.gravityValue = null;
          state.turn.pendingAction = null;
          if (state.turn.remainingValue <= 0) {
            state.turn.remainingValue = 0;
            state.turn.phase = "await-end";
            state.turn.feedback = "잔여 포인트가 없습니다. 턴을 종료하세요.";
          } else {
            state.turn.phase = "action";
            state.turn.feedback = `잔여 포인트 ${state.turn.remainingValue}. 추가 행동을 선택하세요.`;
          }
          render();
          return;
        }
        let cost = rawDistance;
        let usedFreeMove = false;
        if (state.turn.pendingAction === "move" && state.turn.freeMoveMode) {
          const dx = target.x - player.position.x;
          const dy = target.y - player.position.y;
          const isStraight = dx === 0 || dy === 0;
          if (!isStraight) {
            state.turn.feedback = "cos(90°) 효과로는 직선 방향만 이동할 수 있습니다.";
            render();
            return;
          }
          const direction = dx !== 0 ? "x" : "y";
          if (state.turn.freeMoveDirection && state.turn.freeMoveDirection !== direction) {
            state.turn.feedback = "선택한 이동 방향을 유지해야 합니다.";
            render();
            return;
          }
          state.turn.freeMoveDirection = direction;
          cost = 0;
          usedFreeMove = true;
        }
        if (state.turn.pendingAction === "move" && player.power.moveDiscount) {
          cost = Math.max(1, cost - player.power.moveDiscount);
        }
        if (
          isShootAction &&
          state.turn.selectedOrigin !== "self" &&
          player.power.anchorDiscount
        ) {
          cost = Math.max(1, cost - player.power.anchorDiscount);
        }
        if (cost > state.turn.remainingValue) {
          state.turn.feedback = `잔여 포인트 ${state.turn.remainingValue}로는 부족합니다.`;
          render();
          return;
        }

        if (state.turn.pendingAction === "move") {
          const blocked = state.players.some(
            (p) => p.id !== player.id && p.lives > 0 && p.position.x === target.x && p.position.y === target.y
          );
          if (blocked) {
            state.turn.feedback = "그 칸에는 이미 플레이어가 있습니다.";
            render();
            return;
          }
          player.position = target;
          const moveLabel = usedFreeMove ? "무료 이동" : `소모 ${cost}`;
          player.statusText = `이동 완료 ${formatCoord(target)} (${moveLabel})`;
          logEvent(`${player.character}가 ${formatCoord(target)}로 이동했습니다.`);
          applyHazardIfNeeded(player);
        } else {
          const victim = state.players.find(
            (p) => p.id !== player.id && p.lives > 0 && p.position.x === target.x && p.position.y === target.y
          );
          if (isLockedShot && !victim) {
            state.turn.feedback = "고정된 총알에서는 상대를 맞춰야 합니다.";
            render();
            return;
          }
          if (victim) {
            const damaged = applyDamage(victim, 1, "사격");
            player.statusText = damaged
              ? `사격 성공 ${victim.colorLabel}`
              : `사격 차단 ${victim.colorLabel}`;
          } else {
            const alreadyLocked = player.lockedShots[0];
            if (!alreadyLocked || alreadyLocked.x !== target.x || alreadyLocked.y !== target.y) {
              player.lockedShots = [{ ...target }];
            }
            player.statusText = `사격 고정 ${formatCoord(target)}`;
            logEvent(`${player.character}가 ${formatCoord(target)}에 총알을 고정했습니다.`);
          }
          if (usedLockedOrigin) {
            const idx = selectedLockIndex ?? 0;
            player.lockedShots.splice(idx, 1);
            if (state.turn.selectedOrigin?.startsWith("lock-")) {
              state.turn.selectedOrigin = player.lockedShots[idx] ? `lock-${idx}` : "self";
            }
          }
        }

        state.turn.remainingValue -= cost;
        state.turn.pendingAction = null;
        if (state.turn.remainingValue <= 0) {
          state.turn.remainingValue = 0;
          state.turn.phase = "await-end";
          state.turn.feedback = "잔여 포인트가 없습니다. 턴을 종료하세요.";
        } else {
          state.turn.phase = "action";
          state.turn.feedback = `잔여 포인트 ${state.turn.remainingValue}. 추가 행동을 선택하세요.`;
        }
        player.progress = Math.min(100, player.progress + cost);
        render();
      }

      function getOriginCoordinate(player, originId) {
        if (originId === "self") return player.position;
        const index = Number(originId.replace("lock-", ""));
        return player.lockedShots[index] ?? player.position;
      }

      function endTurn() {
        if (!state.charactersAssigned) {
          state.turn.feedback = "캐릭터를 먼저 선택하세요.";
          render();
          return;
        }
        if (state.turn.phase === "complete") {
          render();
          return;
        }
        const player = state.players[state.turn.currentPlayerIndex];
        if (player) {
          const cleaned = player.statusText.replace(/\s*\|\s*턴 종료/g, "").trim();
          let statusSuffix = " | 턴 종료";
          if (player.shootCooldown > 0) {
            player.shootCooldown = Math.max(0, player.shootCooldown - 1);
            statusSuffix += " · 사격 제한 유지";
            if (player.shootCooldown === 0) {
              logEvent(`${player.character}의 사격 제한이 해제되었습니다.`);
            }
          }
          player.statusText = `${cleaned}${statusSuffix}`;
          applyHazardIfNeeded(player);
          if (player.character === "갈루아") {
            player.shieldActive = false;
          }
        }
        state.turn.holdMode = false;
        state.turn.pendingAction = null;
        state.turn.gravityTarget = null;
        state.turn.cardPickMode = null;
        state.turn.gravityValue = null;
        state.turnCount += 1;
        advanceTurn();
        render();
      }

      function advanceTurn() {
        if (state.turn.phase === "complete") return;
        let nextIndex = state.turn.currentPlayerIndex;
        let attempts = 0;
        do {
          nextIndex = (nextIndex + 1) % state.players.length;
          attempts += 1;
          const candidate = state.players[nextIndex];
          if (candidate && candidate.lives > 0) {
            state.hazards = state.hazards.filter(
              (h) => !(h.expiresOnOwnerTurn && h.owner === candidate.id)
            );
            candidate.shootSilenced = isInsideHazard(candidate.position, candidate.id);
            state.turn.currentPlayerIndex = nextIndex;
            state.turn.phase = "await-draw";
            state.turn.remainingValue = 0;
            state.turn.drawSummary = "-";
            state.turn.pendingAction = null;
            const shootNote = [
              candidate.shootCooldown > 0 ? "이번 턴은 사격할 수 없습니다." : "",
              candidate.shootSilenced ? "원형 위협 범위로 사격 불가." : "",
            ]
              .filter(Boolean)
              .join(" ");
            state.turn.feedback = `${candidate.character}의 차례입니다. ${shootNote ? `${shootNote} ` : ""}카드를 뽑으세요.`;
            state.turn.selectedOrigin = "self";
            state.turn.mode = null;
            state.turn.drawnCards = [];
            state.turn.result = 0;
            state.turn.selectedTarget = null;
            state.turn.gravityTarget = null;
            state.turn.holdMode = false;
            state.turn.cardPickMode = null;
            state.turn.gravityValue = null;
            state.turn.freeMoveMode = false;
            state.turn.freeMoveDirection = null;
            candidate.turnsTaken += 1;
            candidate.shieldActive = candidate.character === "갈루아" && candidate.turnsTaken % 2 === 0;
            if (candidate.shieldActive) {
              candidate.statusText = "보호막 전개";
              logEvent(`${candidate.character}가 보호막을 전개했습니다.`);
            }
            return;
          }
        } while (attempts <= state.players.length);
        state.turn.phase = "complete";
        state.turn.feedback = "생존자가 없습니다.";
      }

      function checkForWinner() {
        const alive = state.players.filter((p) => p.lives > 0);
        if (alive.length === 1) {
          const winner = alive[0];
          state.turn.phase = "complete";
          state.turn.remainingValue = 0;
          state.turn.pendingAction = null;
          state.turn.feedback = `${winner.character}가 최후의 생존자가 되었습니다!`;
          logEvent(`${winner.character} 우승!`);
        }
      }

      function logEvent(text) {
        state.logs.unshift(text);
        if (state.logs.length > 6) {
          state.logs.pop();
        }
      }

      function hexToRgba(hex, alpha = 0.35) {
        if (!hex) return `rgba(255,255,255,${alpha})`;
        const sanitized = hex.replace("#", "");
        const bigint = parseInt(sanitized, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      function formatCoord(point) {
        if (!point) return "(--)";
        const x = String(point.x + 1).padStart(2, "0");
        const y = String(state.boardSize - point.y).padStart(2, "0");
        return `(${x},${y})`;
      }

      function render() {
        renderGame();
      }

      render();
    </script>
    <footer>도시 규칙서 미학을 본뜬 인터페이스 © 2024</footer>
  </body>
